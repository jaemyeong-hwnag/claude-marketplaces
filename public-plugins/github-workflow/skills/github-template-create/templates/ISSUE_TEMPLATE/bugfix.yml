name: 버그픽스
description: 의도와 다르게 동작한다 — 잘못된 결과, 오류, 누락
title: "[bugfix] "
labels: ["bugfix"]
body:
  - type: textarea
    id: actual
    attributes:
      label: 무슨 일이 일어났나
      description: 실제 동작과 출력 · 오류 메시지 그대로
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 것
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 최소 재현
      description: 명령 한 줄이나 입력 예. 그대로 테스트가 된다
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: OS · 런타임 버전 · 브랜치나 커밋

  - type: textarea
    id: notes
    attributes:
      label: 더 알아야 할 것

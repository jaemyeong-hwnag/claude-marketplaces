name: 피처
description: 기능 추가, 또는 기존 동작 변경
title: "[feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 왜 필요한가
      description: 지금 무엇이 안 되는가, 누가 무엇에 쓰는가
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 무엇을 하나
      description: 추가하거나 바꾸는 것. 기존 동작이 바뀌면 무엇이 바뀌는지
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇을 확인하면 끝난 것인가 — 명령 · 테스트 · 화면
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 설계 요약
      description: 선택지와 고른 이유. 없으면 비워 둔다
